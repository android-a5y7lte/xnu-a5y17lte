# Galaxy A5 (2017): simpledrm reports a bogus 285x508 mm, so phoc picks scale 1 on this
# 1080x1920, 5.2" (about 424 dpi) panel. Scale 2 gives a 540x960 layout. Both connector names are
# listed: Unknown-1 = simpledrm, DSI-1 = the exynos7880-decon display driver (EVIDENCE 47).
[output:Unknown-1]
scale = 2

[output:DSI-1]
scale = 2
